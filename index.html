let data=(()=>{try{return JSON.parse(localStorage.getItem(key)||'null')}catch(e){return null}})()||seed, current=null, active='overview', editing=null; const $=s=>document.querySelector(s); const uid=p=>p+Math.random().toString(36).slice(2,9); function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}}function esc(s=''){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function fmt(d){return d?new Date(d+'T12:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'}function toast(t){let e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2200)} function proj(){return data.find(x=>x.id===current)}

function stc(s){return s==='Concluído'?'done':s==='Atrasado'?'late':s==='Em pausa'?'review':s==='Planejamento'?'todo':''}
function log(p,text,meta={}){(p.activity??=[]).unshift({id:uid('a'),at:new Date().toISOString(),text:me()+' '+text,who:me(),...meta});p.activity.length=Math.min(p.activity.length,500)}

function taskModal(id=null,status='A fazer',branch=''){let p=proj(),t=id?p.tasks.find(x=>x.id===id):null;editing=t;let opts=p.branches.map(b=>`<option value="${b.id}" ${(t?t.branch:branch)===b.id?'selected':''}>${esc(b.name)}</option>`).join('');showModal(t?'Editar tarefa':'Nova tarefa',`${t?depFlow(t,p):''}<form id="taskForm"><div class="form-grid"><label>Título<input class="field" name="title" required value="${esc(t?.title||'')}"></label><label>Status<select class="field" name="status">${['A fazer','Em andamento','Em revisão','Concluído'].map(x=>`<option ${((t?.status)||status)===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Responsável<input class="field" name="assignee" list="usersList" value="${esc(t?.assignee||'')}"></label><label>Prazo<input class="field" type="date" name="due" value="${t?.due||''}"></label><label>Prioridade<select class="field" name="priority">${['Alta','Média','Baixa'].map(x=>`<option ${t?.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Ramificação<select class="field" name="branch"><option value="">Sem ramificação</option>${opts}</select></label></div><div class="form-full"><label>Descrição<textarea class="field" name="description">${esc(t?.description||'')}</textarea></label></div><div class="form-full"><label>Dependências<select class="field" name="dependencies" multiple size="3">${p.tasks.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${t?.dependencies?.includes(x.id)?'selected':''}>${esc(x.title)}${x.status!=='Concluído'?' (pendente)':''}</option>`).join('')}</select></label></div><div class="form-full"><label>Checklist <span id="subProg"></span></label><div class="pbar" style="margin:8px 0"><i id="subBar"></i></div><div id="subs">${(t?.subtasks||[]).map(subRow).join('')}</div><button class="ghost" type="button" id="newSub">＋ Item</button></div><div class="modal-actions">${t?'<button type="button" class="danger" id="deleteTask">Excluir</button>':'<span></span>'}<button class="primary">Salvar</button></div></form>${t?taskExtras(t):''}`);$('#newSub').onclick=async()=>{let r=await ask('Novo item',[{label:'Nome do item',required:true}]),name=r?.[0];if(name){$('#subs').insertAdjacentHTML('beforeend',subRow({id:uid('s'),title:name,done:false}));updSub()}};$('#subs').onchange=updSub;$('#subs').onclick=e=>{let row=e.target.closest('.next-task');if(!row)return;if(e.target.closest('.sub-x')){row.remove();updSub()}else if(e.target.closest('.sub-t')){let sp=row.querySelector('.sub-t');ask('Renomear item',[{label:'Nome',value:sp.textContent,required:true}]).then(r=>{if(r?.[0])sp.textContent=r[0]})}};updSub();if(t)bindExtras(t);$('#taskForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.dependencies=[...e.target.elements.dependencies.selectedOptions].map(x=>x.value);let oldSubs=t?.subtasks||[];v.subtasks=[...document.querySelectorAll('[data-sub]')].map(x=>({id:x.dataset.sub,title:x.nextElementSibling.textContent,done:x.checked}));if(t){let old=t.status,od=new Set((t.subtasks||[]).filter(s=>s.done).map(s=>s.id));Object.assign(t,v);if(old!==t.status)logTask(p,t);t.subtasks.forEach(s=>{if(s.done&&!od.has(s.id))log(p,'concluiu o item "'+s.title+'" em "'+t.title+'"',{kind:'checklist',task:t.id,branch:t.branch})})}else{let nt={id:uid('t'),tags:'',...v};p.tasks.push(nt);log(p,'criou "'+nt.title+'"',{kind:'task',task:nt.id,branch:nt.branch})}save();close();renderProject();toast(t?'Tarefa salva':'Tarefa criada')};let del=$('#deleteTask');if(del)del.onclick=()=>{log(p,'excluiu a tarefa "'+t.title+'"',{kind:'task',branch:t.branch});p.tasks=p.tasks.filter(x=>x.id!==t.id);p.tasks.forEach(x=>x.dependencies=x.dependencies.filter(d=>d!==t.id));save();close();renderProject();toast('Tarefa excluída')}}
function branchModal(parent){showModal('Nova ramificação',`<form id="branchForm"><div class="form-full"><label>Nome<input class="field" name="name" required autofocus></label></div>${designerSelect(null)}<div class="modal-actions"><span></span><button class="primary">Criar ramificação</button></div></form>`);$('#branchForm').onsubmit=e=>{e.preventDefault();let p=proj();ensureLayout(p);let pp=parent?p.branches.find(x=>x.id===parent):null,base=pp||p.root,x=base.x+(pp?260:280),y=base.y;while(p.branches.some(o=>Math.abs(o.x-x)<230&&Math.abs(o.y-y)<150))y+=160;let nb={id:uid('b'),name:new FormData(e.target).get('name'),parent,x,y,designer:new FormData(e.target).get('designer')||null};p.branches.push(nb);log(p,'criou a ramificação "'+nb.name+'"',{kind:'branch',branch:nb.id});save();close();renderProject();toast('Ramificação criada')}}function branchEditModal(id){let p=proj(),b=p.branches.find(x=>x.id===id),bad=new Set([id]),grow=true;while(grow){grow=false;p.branches.forEach(x=>{if(!bad.has(x.id)&&bad.has(x.parent)){bad.add(x.id);grow=true}})}showModal('Editar ramificação',`<form id="branchEditForm"><div class="form-full"><label>Nome<input class="field" name="name" required value="${esc(b.name)}"></label></div><div class="form-full"><label>Ramificação pai<select class="field" name="parent"><option value="">Projeto (raiz)</option>${p.branches.filter(x=>!bad.has(x.id)).map(x=>`<option value="${x.id}" ${b.parent===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div>${designerSelect(b.designer)}<div class="modal-actions"><button class="danger" type="button" id="deleteBranch">Excluir</button><button class="primary">Salvar</button></div></form>`);$('#branchEditForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let on=b.name,op=b.parent||null,od=b.designer||null;b.name=v.name;b.parent=v.parent||null;b.designer=v.designer||null;if(on!==b.name)log(p,'renomeou a ramificação "'+on+'" para "'+b.name+'"',{kind:'branch',branch:b.id});if(op!==b.parent)log(p,'moveu a ramificação "'+b.name+'"',{kind:'branch',branch:b.id});if(od!==b.designer)log(p,b.designer?'definiu '+user(b.designer).name+' como projetista de "'+b.name+'"':'removeu o projetista de "'+b.name+'"',{kind:'branch',branch:b.id});save();close();renderProject();toast('Ramificação salva')};$('#deleteBranch').onclick=async()=>{if(!await ask('Excluir ramificação?',[],'Excluir','Subramificações sobem um nível e as tarefas ficam sem ramificação.'))return;p.branches.forEach(x=>{if(x.parent===id)x.parent=b.parent});p.tasks.forEach(t=>{if(t.branch===id)t.branch=''});p.branches=p.branches.filter(x=>x.id!==id);log(p,'excluiu a ramificação "'+b.name+'"',{kind:'branch'});save();close();renderProject();toast('Ramificação excluída')}}function addModal(){showModal('Adicionar',`<div class="form-grid"><button class="ghost" id="chooseTask">＋ Tarefa</button><button class="ghost" id="chooseBranch">＋ Ramificação</button><button class="ghost" id="chooseMs">＋ Marco</button></div>`);$('#chooseTask').onclick=()=>{close();taskModal()};$('#chooseBranch').onclick=()=>{close();branchModal(null)};$('#chooseMs').onclick=()=>{close();milestoneModal()}}
function searchModal(){showModal('Pesquisar',`<input id="globalSearch" class="field" style="width:100%" placeholder="Projetos, processos, convênios ou pessoas" autofocus><div class="search-results" id="results"></div>`);let s=$('#globalSearch');let go=()=>{let q=s.value.toLowerCase().trim(),r=[];data.forEach(p=>{if(p.name.toLowerCase().includes(q))r.push([p.id,'Projeto',p.name]);if(p.processo&&('processo '+p.processo).toLowerCase().includes(q))r.push([p.id,'Processo',p.processo+' — '+p.name]);if(hasConv(p)&&(convName(p)+' '+(p.convPolitico||'')).toLowerCase().includes(q))r.push([p.id,'Convênio',[convName(p),p.convPolitico].filter(Boolean).join(' · ')+' — '+p.name]);p.branches.forEach(b=>{if(b.name.toLowerCase().includes(q))r.push([p.id,'Ramificação',b.name])});p.tasks.forEach(t=>{if((t.title+t.assignee).toLowerCase().includes(q))r.push([p.id,'Tarefa',t.title])})});$('#results').innerHTML=q?(r.length?r.map(x=>`<div class="result" data-result="${x[0]}"><strong>${esc(x[2])}</strong><small>${x[1]}</small></div>`).join(''):'<div class="result">Nenhum resultado.</div>'):'';document.querySelectorAll('[data-result]').forEach(e=>e.onclick=()=>{close();openProject(e.dataset.result)})};s.oninput=go;s.focus()}
$('#newProject').onclick=()=>projectModal();$('#homeNew').onclick=()=>projectModal();$('#back').onclick=()=>{setNav('home');renderHome()};$('#editProject').onclick=()=>projectModal(proj());$('#addBtn').onclick=addModal;document.querySelectorAll('[data-settings]').forEach(e=>e.onclick=settingsModal);$('#searchBtn').onclick=searchModal;document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{active=t.dataset.view;renderProject()});let setNav=n=>{[['home','[data-home]'],['board','[data-board]'],['today','[data-today]'],['archive','[data-archive]'],['users','[data-users]'],['history','[data-history]']].forEach(x=>$(x[1]).classList.toggle('active',x[0]===n))};$('[data-home]').onclick=()=>{setNav('home');renderHome()};$('[data-board]').onclick=()=>{setNav('board');renderBoard()};$('[data-today]').onclick=()=>{setNav('today');renderToday()};$('[data-history]').onclick=()=>{setNav('history');renderHistory()};$('[data-more]').onclick=moreModal;$('[data-users]').onclick=()=>{setNav('users');renderUsers()};$('[data-archive]').onclick=()=>{setNav('archive');renderHome(true)};$('[data-close]').onclick=close;$('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();let typing=e.target.closest?.('input,textarea,select,[contenteditable]'),plain=!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey;if((e.ctrlKey&&e.key.toLowerCase()==='k')||(plain&&e.key==='/')){e.preventDefault();searchModal()}if(plain&&(!$('#modalWrap').style.display||$('#modalWrap').style.display==='none')){let inProject=$('#projectView').style.display==='block';if(e.key.toLowerCase()==='n'){inProject?taskModal():projectModal()}if(inProject&&e.key.toLowerCase()==='t')taskModal();if(inProject&&e.key.toLowerCase()==='r')branchModal(null);if(inProject&&'kls'.includes(e.key.toLowerCase())){active={k:'kanban',l:'list',s:'structure'}[e.key.toLowerCase()];renderProject()}}});if(data.map(ensureLayout).includes(true))save();initUsers();renderHome();
</script></body></html>
